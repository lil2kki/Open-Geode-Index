name: Build Geode Mod (SDK v5)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:

  build:
    continue-on-error: true # continue even if build failed for some platform
    strategy:
    
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
          
        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android64
          os: ubuntu-latest
          target: Android64

        - name: Android32
          os: ubuntu-latest
          target: Android32
          
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
        - name: "Set up Git repository"
          uses: actions/checkout@v3

        - name: Remove SDK5- prefix from filenames
          shell: bash
          run: |
            find . -depth -name '*SDK5-*' | while IFS= read -r path; do
              new_path="$(dirname "$path")/$(basename "$path" | sed 's/SDK5-//g')"
              if [ "$path" != "$new_path" ]; then
                mv "$path" "$new_path"
              fi
            done

        - name: Build the mod
          uses: geode-sdk/build-geode-mod@main
          with:
            combine: true
            export-pdb: true
            export-symbols: true
            build-config: ${{ matrix.config.type || 'Release' }}
            target: ${{ matrix.config.target }}
          
  upload:
    name: Combine and upload builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
          
      - name: "Combine builds"
        uses: geode-sdk/build-geode-mod/combine@main
        id: build
        with:
          zstd: false
          optimize-pngs: false
        
      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
          
      - name: "Set up Git repository"
        uses: actions/checkout@v3
        
      - name: "Get mod properties"
        id: json_properties
        uses: ActionsTools/read-json-action@main
        with:
          file_path: "mod.json"
        
      - name: "Try Release Version"
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          tag: "${{steps.json_properties.outputs.version}}"
          artifacts: "${{steps.build.outputs.build-output}}/*"
          artifactErrorsFailBuild: true
          allowUpdates: true